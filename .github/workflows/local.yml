name: Local E2E Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  PLAYWRIGHT_BROWSERS_PATH: 0
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build OpenNext packages
        shell: bash
        run: pnpm --filter @opennextjs/aws... run build

      - name: Build examples apps with local configuration
        shell: bash
        run: pnpm openbuild:local

      # Remember to add more ports here if we add new examples app
      - name: Start the local OpenNext servers
        shell: bash
        run: |
          pnpm openbuild:local:start &

          # Check all ports in parallel with generous timeout
          pids=()
          for port in 3001 3002 3003 3004; do
            (
              echo "Checking port $port..."
              for attempt in $(seq 1 40); do
                sleep 1
                if curl --silent --fail http://localhost:$port > /dev/null 2>&1; then
                  echo "Server on $port is ready"
                  exit 0
                fi
                echo "Waiting for server on $port, attempt $attempt..."
              done
              echo "ERROR: Server on $port failed to start"
              exit 1
            ) &
            pids+=($!)
          done

          # Wait for all background checks and collect exit codes
          failed=0
          for pid in "${pids[@]}"; do
            wait $pid || failed=1
          done

          if [ $failed -eq 1 ]; then
            echo "One or more servers failed to start"
            exit 1
          fi
      - name: Run E2E Test locally
        shell: bash
        run: |
          pnpm e2e:test
  cloudflare:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build OpenNext packages
        shell: bash
        run: pnpm --filter @opennextjs/cloudflare run build

      - name: Build worker with local configuration
        shell: bash
        run: pnpm turbo build:worker:cf

      - name: Run E2E Test in Cloudflare Environment
        shell: bash
        run: pnpm turbo e2e:cf

      - name: Run Cloudflare Container E2E Test
        shell: bash
        run: |
          pnpm --filter examples-cloudflare/e2e-app-router build:worker:container
          pnpm --filter examples-cloudflare/e2e-app-router e2e:container
